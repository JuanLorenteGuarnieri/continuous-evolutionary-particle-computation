 name: CI/CD
 
 on:
   push:
     branches: [ main ]
   pull_request:
     branches: [ main ]
 
 jobs:
   test:
     runs-on: ubuntu-latest
     steps:
       - uses: actions/checkout@v4
       - name: Setup Node
         uses: actions/setup-node@v4
         with:
           node-version: 22
       - name: Setup pnpm
         uses: pnpm/action-setup@v3
         with:
           version: 8
       - name: Install dependencies
         run: pnpm install --frozen-lockfile
       - name: Lint
         run: pnpm run lint
       - name: Test TypeScript
         run: pnpm test
       - name: Setup C++
         run: |
           sudo apt-get update
           sudo apt-get install -y cmake g++
       - name: Configure C++
         run: cmake -S src/cpp-oracle -B build
       - name: Build C++
         run: cmake --build build
       - name: Test C++
         run: ctest --test-dir build --output-on-failure
       - name: Setup Python
         uses: actions/setup-python@v5
         with:
           python-version: '3.11'
       - name: Install Python dependencies
         run: pip install -r python/requirements.txt
       - name: Test Python
         run: pytest python/
       - name: Run behavioral tests
         run: pnpm test --filter behavioral
       - name: Run WebGPU tests
         run: pnpm test --filter @cepc/webgpu-core || echo 'WebGPU tests skipped (no GPU support)'
       - name: Run WebGPU MFM tests
         run: pnpm test --filter @cepc/webgpu-mfm || echo 'WebGPU MFM tests skipped (no GPU support)'
       - name: Run experiment API tests
         run: pnpm test --filter @cepc/experiment-api
       - name: Upload test results
         uses: actions/upload-artifact@v4
         with:
           name: test-results
           path: |
             **/test-results/**
             **/coverage/
 
   deploy:
     needs: test
     runs-on: ubuntu-latest
     if: github.ref == 'refs/heads/main'
     steps:
       - uses: actions/checkout@v4
       - name: Setup Node
         uses: actions/setup-node@v4
         with:
           node-version: 22
       - name: Setup pnpm
         uses: pnpm/action-setup@v3
         with:
           version: 8
       - name: Install dependencies
         run: pnpm install --frozen-lockfile
       - name: Build React UI
         run: pnpm --filter @cepc/react-ui run build
       - name: Deploy to GitHub Pages
         uses: peaceiris/actions-gh-pages@v3
         with:
           github_token: {{ secrets.GITHUB_TOKEN }}
           publish_dir: src/react-ui/dist
           destination_dir: .
           force_orphan: true
