 name: Validation
 on:
   schedule:
     - cron: '0 2 * * *'
   workflow_dispatch:
   release:
     types: [published]
 jobs:
   validate:
     runs-on: ubuntu-latest
     steps:
       - uses: actions/checkout@v4
       - name: Setup Node
         uses: actions/setup-node@v4
         with:
           node-version: 22
       - name: Install pnpm
         uses: pnpm/action-setup@v3
         with:
           version: 8.15.9
       - name: Install dependencies
         run: pnpm install
       - name: Run validation subset
         run: pnpm run validate:subset
       - name: Run benchmarks
         run: pnpm run benchmark
       - name: Upload artifacts
         uses: actions/upload-artifact@v4
         with:
           name: validation-results
           path: performance/
